name: Build Nhe Tam Pro Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Compile Android APK
        run: |
          set -e
          cd android
          echo "=== Available Android SDK Platforms ==="
          ls -la "$ANDROID_HOME/platforms" || true
          
          echo "=== Building APK ==="
          gradle assembleDebug --stacktrace --no-daemon
          
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found after build!"
            exit 1
          fi
          echo "Built APK located at: $APK_PATH"
          cp "$APK_PATH" ../NheTamPro_V5.apk
          cd ..
          ls -lh NheTamPro_V5.apk

      - name: Commit Client APK to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add NheTamPro_V5.apk
          git commit -m "Update compiled NheTamPro_V5.apk" || echo "Already committed"
          git push

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android_Client_APK
          path: NheTamPro_V5.apk
