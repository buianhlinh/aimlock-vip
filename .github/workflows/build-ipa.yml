name: Build Nhe Tam Pro iOS IPA

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile Native iOS ARM64 Binary & Package Client IPA
        run: |
          set -e
          echo "=== Compiling Client App: NheTamPro_V5.ipa ==="
          mkdir -p build_client/Payload/NheTamPro.app
          xcrun -sdk iphoneos clang -target arm64-apple-ios14.0 \
            -fobjc-arc -O3 \
            -framework UIKit \
            -framework WebKit \
            -framework Foundation \
            ios/main.m -o build_client/Payload/NheTamPro.app/NheTamPro
          
          cp ios/Info.plist build_client/Payload/NheTamPro.app/Info.plist
          cp ios/*.png build_client/Payload/NheTamPro.app/ 2>/dev/null || true
          echo -n "APPL????" > build_client/Payload/NheTamPro.app/PkgInfo
          
          cd build_client
          zip -qry9 ../NheTamPro_V5.ipa Payload
          cd ..
          ls -lh NheTamPro_V5.ipa

      - name: Commit Client IPA to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add NheTamPro_V5.ipa
          git commit -m "Update compiled NheTamPro_V5.ipa" || echo "Already committed"
          git push

      - name: Upload Client IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS_Client_IPA
          path: NheTamPro_V5.ipa
