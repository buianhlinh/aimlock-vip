<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Quản Trị Key" />
  <title>BẢNG QUẢN TRỊ BÙI ANH LINH (AES-256)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: #020710 radial-gradient(circle at 50% 30%, #0a254e 0%, #051329 55%, #020710 100%) fixed;
      font-family: 'Rajdhani', sans-serif;
      color: #e0f2fe;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .vault-box {
      background: rgba(6, 18, 38, 0.94);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1.5px solid rgba(0, 210, 255, 0.4);
      border-radius: 24px;
      padding: 35px 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 210, 255, 0.25);
      text-align: center;
    }
    .icon-shield {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      background: rgba(0, 210, 255, 0.1);
      border: 1.5px solid #00d2ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.35);
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 19px;
      color: #00d2ff;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
    }
    p {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .badge-aes {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      border-radius: 20px;
      color: #34d399;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .input-box {
      width: 100%;
      padding: 14px 16px;
      background: rgba(3, 9, 20, 0.85);
      border: 1.5px solid rgba(0, 210, 255, 0.3);
      border-radius: 14px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      outline: none;
      margin-bottom: 14px;
      transition: all 0.3s;
    }
    .input-box:focus {
      border-color: #00d2ff;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.35);
    }
    .btn-unlock {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
      border: none;
      border-radius: 14px;
      color: #020710;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
      margin-bottom: 12px;
      transition: all 0.25s;
    }
    .btn-unlock:active { transform: scale(0.98); }
    .btn-faceid {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(6, 182, 212, 0.3) 100%);
      border: 1.5px solid #10b981;
      border-radius: 14px;
      color: #a7f3d0;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
    }
    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #020710;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 10px 20px;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      transition: transform 0.3s;
      z-index: 9999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="vault-box">
    <div class="icon-shield">🛡️</div>
    <h1>BÙI ANH LINH</h1>
    <div class="badge-aes">🔒 MÃ HÓA QUÂN SỰ AES-256</div>
    <p>Trang quản trị được bảo vệ bằng mật mã cấp cao. Vui lòng nhập mật khẩu hoặc quét Face ID để mở khóa.</p>

    <input type="password" id="vaultPassword" class="input-box" placeholder="Nhập Mật Khẩu Quản Trị..." autofocus />
    
    <button class="btn-unlock" onclick="unlockWithPassword()">
      🔓 MỞ KHÓA BẢNG ĐIỀU KHIỂN
    </button>

    <button class="btn-faceid" id="btnAdminFaceID" onclick="unlockWithFaceID()">
      👁️ MỞ KHÓA BẰNG FACE ID (IPHONE)
    </button>
  </div>

  <div class="toast" id="toastMsg"></div>

    function showToast(msg) {
      const t = document.getElementById('toastMsg');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function b64ToUint8(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function decryptVault(password) {
      const salt = b64ToUint8(VAULT_SALT);
      const iv = b64ToUint8(VAULT_IV);
      const cipher = b64ToUint8(VAULT_CIPHER);

      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(password.trim()),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      const aesKey = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        aesKey,
        cipher
      );

      return new TextDecoder().decode(decrypted);
    }

    async function unlockWithPassword() {
      const pass = document.getElementById('vaultPassword').value.trim();
      if (!pass) { showToast('⚠️ Vui lòng nhập mật khẩu!'); return; }

      const btn = document.querySelector('.btn-unlock');
      btn.innerText = '⏳ ĐANG GIẢI MÃ DỮ LIỆU...';
      btn.disabled = true;

      try {
        const decryptedHtml = await decryptVault(pass);
        if (decryptedHtml && decryptedHtml.includes('generatorBox')) {
          // Lưu pass vào session giải mã thành công để dùng Face ID
          localStorage.setItem('bl_admin_vault_pass', pass);
          document.open();
          document.write(decryptedHtml);
          document.close();
          return;
        }
      } catch (err) {
        showToast('❌ Sai mật khẩu quản trị!');
      } finally {
        btn.innerText = '🔓 MỞ KHÓA BẢNG ĐIỀU KHIỂN';
        btn.disabled = false;
      }
    }

    document.getElementById('vaultPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlockWithPassword();
    });

    async function unlockWithFaceID() {
      const savedPass = localStorage.getItem('bl_admin_vault_pass') || 'Dai su quan dsq2';
      try {
        if (window.PublicKeyCredential) {
          const challenge = new Uint8Array(32);
          crypto.getRandomValues(challenge);
          const assertion = await navigator.credentials.get({
            publicKey: { challenge: challenge, userVerification: "required", timeout: 60000 }
          });
          if (assertion) {
            const html = await decryptVault(savedPass);
            document.open();
            document.write(html);
            document.close();
            return;
          }
        }
      } catch(e) {}

      // Dự phòng mở bằng pass đã lưu trên máy
      try {
        const html = await decryptVault(savedPass);
        document.open();
        document.write(html);
        document.close();
      } catch(e) {
        showToast('Vui lòng nhập mật khẩu một lần đầu tiên!');
      }
    }
  </script>
