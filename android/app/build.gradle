plugins {
    id 'com.android.application'
}

android {
    namespace 'com.buianhlinh.nhetampro'
    compileSdk 34

    defaultConfig {
        applicationId "com.buianhlinh.nhetampro"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "5.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
